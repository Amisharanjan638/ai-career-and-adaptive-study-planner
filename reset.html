<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Reset Password — MargZen</title>

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,600;0,700;1,400&family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap"
        rel="stylesheet">

    <!-- External CSS -->
    <link rel="stylesheet" href="login.css">
</head>

<body class="auth-page-body">

    <div class="auth-wrapper">

        <div class="clean-auth-card">

            <!-- Card Top: Brand Logo -->
            <div class="auth-card-top">
                <div class="auth-card-brand">
                    <img src="logo.jpg" onerror="this.onerror=null; this.style.display='none';" alt="MargZen Logo" class="auth-card-logo">
                    <span class="auth-card-brandname">Marg<span>Zen</span></span>
                </div>
            </div>

            <!-- Main Heading -->
            <div class="auth-card-heading-wrap">
                <h2 class="auth-main-headline">Create New Password</h2>
            </div>
            <p class="auth-subtext">Your new password must be at least 6 characters, include one uppercase letter, and may use letters, numbers, <strong>_</strong> or <strong>@</strong>.</p>

            <!-- Form Body -->
            <form id="resetPasswordForm" novalidate>

                <!-- New Password -->
                <div class="input-block">
                    <label class="input-title">New Password</label>

                    <div class="clean-field-box" id="newPwdFieldBox">
                        <input type="password" id="newPassword" placeholder="Enter new password"
                               oninput="handleNewPasswordInput()">

                        <button type="button" class="eye-toggle-icon" onclick="toggleEye('newPassword', 'newPwdEyeSvg')"
                                title="Show/Hide Password">
                            <svg id="newPwdEyeSvg" width="18" height="18" viewBox="0 0 24 24" fill="none"
                                 stroke="currentColor" stroke-width="2">
                                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                                <circle cx="12" cy="12" r="3"></circle>
                            </svg>
                        </button>
                    </div>
                    <span class="field-error" id="newPasswordError">Not a strong password</span>
                </div>

                <!-- Confirm Password -->
                <div class="input-block">
                    <label class="input-title">Confirm Password</label>

                    <div class="clean-field-box" id="confirmPwdFieldBox">
                        <input type="password" id="confirmPassword" placeholder="Re-enter new password"
                               oninput="handleConfirmPasswordInput()">

                        <button type="button" class="eye-toggle-icon" onclick="toggleEye('confirmPassword', 'confirmPwdEyeSvg')"
                                title="Show/Hide Password">
                            <svg id="confirmPwdEyeSvg" width="18" height="18" viewBox="0 0 24 24" fill="none"
                                 stroke="currentColor" stroke-width="2">
                                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                                <circle cx="12" cy="12" r="3"></circle>
                            </svg>
                        </button>
                    </div>
                    <span class="field-error" id="confirmPasswordError">Passwords do not match</span>
                </div>

                <!-- Submit Button -->
                <button type="submit" class="btn-proceed-securely" id="btnResetProceed">
                    <span>Proceed</span>
                </button>

            </form>

        </div>

    </div>

    <!-- Toast Notification Container -->
    <div id="toast" class="toast" role="alert">
        <span id="toastIcon">✨</span>
        <span id="toastMsg">Notification message</span>
    </div>

    <!-- External Script -->
    <script src="reset.js"></script>

</body>

</html>
